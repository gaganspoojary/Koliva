<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Namma Koli Mandi — Daily Poultry Rates</title>
<style>
  :root { --g:#065f46; --g2:#ecfdf5; --bg:#f8fafc; --tx:#0f172a; --mut:#64748b; --bd:#e2e8f0; --up:#15803d; --dn:#b91c1c; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Kannada", sans-serif; background:var(--bg); color:var(--tx); }
  header { background:var(--g); color:#fff; padding:18px 16px; }
  header h1 { margin:0; font-size:1.4rem; }
  header p { margin:4px 0 0; opacity:.85; font-size:.9rem; }
  main { max-width:960px; margin:0 auto; padding:14px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  button, select, input { font:inherit; padding:8px 12px; border:1px solid var(--bd); border-radius:8px; background:#fff; }
  button { cursor:pointer; }
  button.on { background:var(--g); color:#fff; border-color:var(--g); }
  input { flex:1; min-width:160px; }
  .home { background:var(--g2); border:1px solid #a7f3d0; border-radius:12px; padding:14px; margin-bottom:14px; }
  .home h2 { margin:0 0 8px; font-size:1.05rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:8px; }
  .box { background:#fff; border-radius:8px; padding:8px 10px; border:1px solid var(--bd); }
  .box small { color:var(--mut); display:block; font-size:.72rem; }
  .box b { font-size:1.2rem; }
  .wrap { overflow-x:auto; background:#fff; border:1px solid var(--bd); border-radius:12px; }
  table { border-collapse:collapse; width:100%; min-width:560px; }
  th, td { padding:10px 12px; text-align:right; border-bottom:1px solid var(--bd); white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; position:sticky; left:0; background:#fff; }
  th { background:#f1f5f9; font-size:.78rem; color:var(--mut); text-transform:uppercase; }
  tr.home-row td { background:var(--g2); }
  .up { color:var(--up); } .dn { color:var(--dn); } .same { color:var(--mut); }
  .sub { color:var(--mut); font-size:.75rem; display:block; }
  footer { text-align:center; color:var(--mut); font-size:.8rem; padding:20px 14px; }
  #empty { padding:20px; text-align:center; color:var(--mut); display:none; }
</style>
</head>
<body>

<header>
  <h1>🐔 Namma Koli Mandi</h1>
  <p id="sub">Daily broiler rates — <span id="date"></span></p>
</header>

<main>
  <div id="home"></div>

  <div class="row" id="states"></div>
  <div class="row">
    <input id="search" type="search" placeholder="Search district / ಜಿಲ್ಲೆ ಹುಡುಕಿ">
    <select id="sort">
      <option value="list">Default order</option>
      <option value="high">Highest farm rate</option>
      <option value="low">Lowest farm rate</option>
      <option value="az">A – Z</option>
    </select>
    <button id="lang">ಕನ್ನಡ / EN</button>
    <button id="share">📲 Copy for WhatsApp</button>
  </div>

  <div class="wrap">
    <table>
      <thead>
        <tr>
          <th>District</th>
          <th>Farm ₹/kg</th>
          <th>Change</th>
          <th>Wholesale</th>
          <th>Retail</th>
          <th>Chick ₹</th>
        </tr>
      </thead>
      <tbody id="body"></tbody>
    </table>
    <div id="empty">No district found.</div>
  </div>
</main>

<footer id="foot"></footer>

<!-- The rates live in this file. Edit rates.js, not this page. -->
<script src="rates.js"></script>
<script>
  // ---- Read the table from rates.js ----
  const rows = RATE_TABLE.trim().split("\n").map(l => l.trim()).filter(Boolean).map((line, i) => {
    const p = line.split("|").map(x => x.trim());
    return { order:i, state:p[0], name:p[1], kn:p[2], prev:+p[3], farm:+p[4], whole:+p[5], retail:+p[6], chick:+p[7] };
  });

  const states = ["All", ...new Set(rows.map(r => r.state))];
  let stateSel = "All", useKn = false;

  const $ = id => document.getElementById(id);
  const label = r => useKn ? r.kn : r.name;
  const diff = r => r.farm - r.prev;

  function arrow(r) {
    const d = diff(r);
    if (d > 0) return `<span class="up">▲ +${d}</span>`;
    if (d < 0) return `<span class="dn">▼ ${d}</span>`;
    return `<span class="same">–</span>`;
  }

  function visible() {
    const q = $("search").value.trim().toLowerCase();
    let list = rows.filter(r =>
      (stateSel === "All" || r.state === stateSel) &&
      (!q || r.name.toLowerCase().includes(q) || r.kn.includes(q)));
    const s = $("sort").value;
    if (s === "high") list.sort((a,b) => b.farm - a.farm);
    if (s === "low")  list.sort((a,b) => a.farm - b.farm);
    if (s === "az")   list.sort((a,b) => a.name.localeCompare(b.name));
    if (s === "list") list.sort((a,b) => a.order - b.order);
    return list;
  }

  function render() {
    // Home card
    const h = rows.find(r => r.name.toLowerCase().startsWith(HOME_DISTRICT.toLowerCase()));
    $("home").innerHTML = h ? `
      <div class="home">
        <h2>⭐ ${label(h)} — ${useKn ? "ಇಂದಿನ ದರ" : "Today's rate"}</h2>
        <div class="grid">
          <div class="box"><small>${useKn ? "ಫಾರ್ಮ್ ದರ" : "Farm rate"}</small><b>₹${h.farm}</b> ${arrow(h)}</div>
          <div class="box"><small>${useKn ? "ಸಗಟು" : "Wholesale"}</small><b>₹${h.whole}</b></div>
          <div class="box"><small>${useKn ? "ಚಿಲ್ಲರೆ" : "Retail"}</small><b>₹${h.retail}</b></div>
          <div class="box"><small>${useKn ? "ಮರಿ" : "Chick"}</small><b>₹${h.chick}</b></div>
        </div>
      </div>` : "";

    // State buttons
    $("states").innerHTML = states.map(s =>
      `<button class="${s===stateSel?"on":""}" data-s="${s}">${s}</button>`).join("");

    // Table
    const list = visible();
    $("body").innerHTML = list.map(r => `
      <tr class="${h && r===h ? "home-row" : ""}">
        <td>${label(r)}<span class="sub">${r.state}</span></td>
        <td><b>₹${r.farm}</b></td>
        <td>${arrow(r)}</td>
        <td>₹${r.whole}</td>
        <td>₹${r.retail}</td>
        <td>₹${r.chick}</td>
      </tr>`).join("");
    $("empty").style.display = list.length ? "none" : "block";
  }

  // ---- Events ----
  $("states").onclick = e => { if (e.target.dataset.s) { stateSel = e.target.dataset.s; render(); } };
  $("search").oninput = render;
  $("sort").onchange = render;
  $("lang").onclick = () => { useKn = !useKn; render(); };
  $("share").onclick = () => {
    const list = visible().slice(0, 15);
    const text = `🐔 *Namma Koli Mandi* — ${DATE}\nFarm rate (₹/kg)\n\n` +
      list.map(r => `${label(r)}: ₹${r.farm}`).join("\n");
    navigator.clipboard.writeText(text).then(
      () => alert("Copied! Paste it in WhatsApp."),
      () => prompt("Copy this text:", text));
  };

  // ---- Static text ----
  $("date").textContent = new Date(DATE + "T00:00:00").toLocaleDateString("en-IN",
    { day:"numeric", month:"short", year:"numeric" });
  $("foot").textContent = FOOTER_NOTE;
  render();
</script>
</body>
</html>

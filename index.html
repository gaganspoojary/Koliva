<style>

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-size:16px; line-height:1.4; font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Kannada",sans-serif; background:var(--cream); color:var(--ink); }
  a { color:inherit; }

  header { position:relative; background:linear-gradient(180deg,#0f4423 0%,#1b6a3b 100%); color:#fff; padding:20px 18px 104px; overflow:hidden; }
  .head { max-width:720px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; position:relative; z-index:2; }
  .brand { display:flex; align-items:center; gap:12px; }
  .logo { width:50px; height:50px; flex:none; filter:drop-shadow(0 2px 4px rgba(0,0,0,.3)); }
  .brand h1 { margin:0; font:700 1.8rem/1 Georgia,"Times New Roman",serif; letter-spacing:.3px; }
  .brand small { display:block; margin-top:5px; font-size:.7rem; letter-spacing:.16em; text-transform:uppercase; opacity:.85; }
  #lang { background:rgba(255,255,255,.14); color:#fff; border:1px solid rgba(255,255,255,.4); border-radius:999px; padding:9px 15px; font:inherit; font-size:.9rem; white-space:nowrap; }
  .updated { max-width:720px; margin:18px auto 0; position:relative; z-index:2; }
  .updated span { display:inline-block; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.28); border-radius:999px; padding:6px 14px; font-size:.85rem; }
  .hills { position:absolute; left:0; right:0; bottom:-1px; width:100%; height:92px; z-index:1; }

  main { max-width:720px; margin:-14px auto 0; padding:0 16px 8px; position:relative; z-index:3; }

  .home { position:relative; overflow:hidden; background:linear-gradient(180deg,#fffdf8,#fbf5e4); border:1px solid var(--line); border-radius:22px; padding:20px 20px 20px 24px; box-shadow:0 10px 30px rgba(20,83,45,.16); margin-bottom:24px; }
  .home:before { content:""; position:absolute; left:0; top:0; bottom:0; width:6px; background:linear-gradient(var(--egg),#d4851a); }
  .eyebrow { font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:var(--leaf); font-weight:700; }
  .home h2 { margin:4px 0 0; font:700 1.35rem/1.2 Georgia,"Times New Roman",serif; color:var(--forest); }
  .big { display:flex; align-items:center; flex-wrap:wrap; gap:10px; margin-top:10px; font-size:2.8rem; line-height:1; font-weight:800; color:var(--forest); font-variant-numeric:tabular-nums; }
  .unit { color:var(--mut); font-size:.85rem; margin-top:6px; }
  .mini { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px; }
  .mini div { background:#faf3df; border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .mini small { display:block; color:var(--mut); font-size:.72rem; }
  .mini b { font-size:1.05rem; font-variant-numeric:tabular-nums; }

  #search { width:100%; height:52px; font:inherit; padding:0 18px; border:1px solid var(--line); border-radius:14px; background:var(--paper); margin-bottom:14px; }
  #search:focus { outline:2px solid var(--leaf); }
  .chips { display:flex; gap:10px; overflow-x:auto; padding:2px 0 12px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chips button { flex:none; border:1px solid var(--line); background:var(--paper); color:var(--ink); border-radius:999px; padding:10px 18px; font:inherit; }
  .chips button.on { background:var(--forest); color:#fff; border-color:var(--forest); }
  .tools { display:flex; gap:10px; margin:4px 0 22px; }
  .tools select, .tools button { flex:1; height:48px; font:inherit; font-size:.95rem; border:1px solid var(--line); border-radius:12px; background:var(--paper); padding:0 12px; }
  .tools button { display:flex; align-items:center; justify-content:center; gap:8px; background:var(--wa); border-color:var(--wa); color:#fff; font-weight:600; }

  .sechead { display:flex; justify-content:space-between; align-items:baseline; margin:0 4px 12px; }
  .sechead h3 { margin:0; font:700 1.15rem/1.2 Georgia,"Times New Roman",serif; color:var(--forest); }
  .count { color:var(--mut); font-size:.85rem; }

  .list { display:grid; gap:14px; }
  .card { background:var(--paper); border:1px solid var(--line); border-radius:18px; padding:16px 18px; box-shadow:0 2px 8px rgba(80,60,20,.07); }
  .card.is-home { border-color:var(--egg); }
  .top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .name { font-weight:650; font-size:1.05rem; }
  .state { color:var(--mut); font-size:.8rem; margin-top:2px; }
  .price { text-align:right; }
  .price b { font-size:1.75rem; font-weight:800; display:block; line-height:1.1; color:var(--forest); font-variant-numeric:tabular-nums; }
  .card .mini { margin-top:12px; }
  .chg { display:inline-block; margin-top:6px; padding:2px 9px; border-radius:999px; font-size:.78rem; font-weight:700; }
  .big .chg { margin-top:0; font-size:.9rem; }
  .chg.up { background:#e3f4e8; color:var(--up); } .chg.dn { background:#fbe5e3; color:var(--dn); } .chg.same { background:#eee9d6; color:var(--mut); }
  #empty { text-align:center; color:var(--mut); padding:30px 0; display:none; }
  #status { text-align:center; color:var(--mut); font-size:.85rem; padding:24px 16px 6px; }
  #status.bad { color:var(--dn); font-weight:600; }

  footer { margin-top:18px; padding:26px 18px 110px; background:#ece3c6; text-align:center; color:var(--mut); font-size:.85rem; }
  .wrapf { max-width:720px; margin:0 auto; }
  .btns { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:16px; }
  .btn { display:inline-flex; align-items:center; gap:8px; padding:12px 20px; border-radius:999px; text-decoration:none; font-weight:600; font-size:.95rem; }
  .btn.wa { background:var(--wa); color:#fff; }
  .btn.call { background:var(--forest); color:#fff; }
  .creator { display:flex; align-items:center; gap:14px; justify-content:center; text-align:left; background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin:18px auto 14px; max-width:360px; }
  .avatar { position:relative; width:58px; height:58px; border-radius:50%; background:var(--forest); color:#fff; display:grid; place-items:center; font-weight:700; overflow:hidden; border:2px solid var(--egg); flex:none; }
  .avatar img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .creator small { display:block; color:var(--mut); font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; }
  .creator b { display:block; color:var(--ink); font-size:1.05rem; }
  .creator a { color:var(--leaf); font-size:.85rem; font-weight:600; }
  .copy { margin:6px 0 0; font-size:.8rem; }

  .fab { position:fixed; right:16px; bottom:16px; z-index:20; display:flex; align-items:center; gap:8px; background:var(--wa); color:#fff; text-decoration:none; font-weight:600; padding:13px 18px; border-radius:999px; box-shadow:0 6px 18px rgba(0,0,0,.28); }
  @media (min-width:700px) { .list { grid-template-columns:1fr 1fr; } }
</style>

    $("fab").innerHTML = WA_ICON + "<span>" + t("chat") + "</span>";
    $("waLink").innerHTML = WA_ICON + "<span>" + t("chat") + "</span>";
    $("callLink").textContent = t("call") + " " + PHONE_DISPLAY;
    $("rhead").textContent = t("rates");
    $("copy").textContent = "© " + new Date().getFullYear() + " Koliva";
    $("creator").innerHTML =
      '<div class="avatar"><span>' + esc(initials(CREATOR_NAME)) + '</span>' +
      (CREATOR_PHOTO ? '<img src="' + esc(CREATOR_PHOTO) + '" alt="" onerror="this.remove()">' : "") + '</div>' +
      '<div><small>' + t("built") + '</small><b>' + esc(CREATOR_NAME) + '</b>' +
      '<a href="' + WA_URL + '" target="_blank" rel="noopener">WhatsApp ' + PHONE_DISPLAY + '</a></div>';
    if (!DATE) $("sub").textContent = t("daily");
  }

  function parseCSV(text) {
    const out = []; let row = [], cur = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; }
        else if (c === '"') q = false;
        else cur += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(cur); cur = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(cur); out.push(row); row = []; cur = "";
      } else cur += c;
    }
    if (cur !== "" || row.length) { row.push(cur); out.push(row); }
    return out;
  }

  function readSheet(csv) {
    const data = parseCSV(csv);
    let d = ((data[0] && data[0][1]) || "").trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) {
      const dt = new Date(d);
      d = (d && !isNaN(dt)) ? dt.getFullYear() + "-" + ("0" + (dt.getMonth() + 1)).slice(-2) + "-" + ("0" + dt.getDate()).slice(-2) : "";
    }
    DATE = d;
    rows = [];
    for (let i = 2; i < data.length; i++) {
      const r = data[i].map(s => (s || "").trim());
      if (!r[1] || !r[4]) continue;
      const farm = num(r[4]);
      rows.push({ order: rows.length, state: r[0] || "Other States", name: r[1], kn: r[2] || r[1],
        prev: r[3] ? num(r[3]) : farm, farm: farm, whole: num(r[5]), retail: num(r[6]), chick: num(r[7]) });
    }
  }

  async function load() {
    let csv = null, source = "", err = "";
    try {
      const res = await fetch(SHEET_URL + (SHEET_URL.indexOf("?") > -1 ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      csv = await res.text();
      source = "live";
      try { localStorage.setItem("koli_csv", csv); } catch (e) {}
    } catch (e) {
      err = e && e.message ? e.message : String(e);
      try { csv = localStorage.getItem("koli_csv"); if (csv) source = "saved"; } catch (e2) {}
    }
    const st = $("status");
    if (!csv) { st.className = "bad"; st.textContent = "Could not load rates (" + err + "). Please check the internet and refresh."; return; }
    readSheet(csv);
    if (source === "live") { st.className = ""; st.textContent = "✓ Live rates from Google Sheet"; }
    else { st.className = "bad"; st.textContent = "Showing last saved rates. Could not reach the sheet (" + err + ")."; }
    $("foot").textContent = NOTE;
    render();
  }

  const label = r => useKn ? r.kn : r.name;
  function arrow(r) {
    const d = r.farm - r.prev;
    if (d > 0) return '<span class="chg up">▲ +' + d + '</span>';
    if (d < 0) return '<span class="chg dn">▼ ' + d + '</span>';
    return '<span class="chg same">–</span>';
  }

  function visible() {
    const q = $("search").value.trim().toLowerCase();
    const list = rows.filter(r => (stateSel === "All" || r.state === stateSel) &&
      (!q || r.name.toLowerCase().indexOf(q) > -1 || r.kn.indexOf(q) > -1));
    const s = $("sort").value;
    if (s === "high") list.sort((a, b) => b.farm - a.farm);
    if (s === "low")  list.sort((a, b) => a.farm - b.farm);
    if (s === "az")   list.sort((a, b) => a.name.localeCompare(b.name));
    if (s === "list") list.sort((a, b) => a.order - b.order);
    return list;
  }

  function miniBlock(r) {
    return '<div class="mini">' +
      '<div><small>' + t("whole") + '</small><b>₹' + r.whole + '</b></div>' +
      '<div><small>' + t("retail") + '</small><b>₹' + r.retail + '</b></div>' +
      '<div><small>' + t("chick") + '</small><b>₹' + r.chick + '</b></div></div>';
  }

  function render() {
    applyLabels();
    if (DATE) {
      const dd = new Date(DATE + "T00:00:00");
      $("sub").textContent = t("daily") + " — " + (isNaN(dd) ? DATE : dd.toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }));
    }
    const h = rows.find(r => r.name.toLowerCase().indexOf(HOME_DISTRICT.toLowerCase()) === 0);
    $("home").innerHTML = h ? '<div class="home"><div class="eyebrow">' + t("today") + '</div><h2>' + esc(label(h)) + '</h2>' +
      '<div class="big">₹' + h.farm + arrow(h) + '</div><div class="unit">' + t("farm") + ' / kg</div>' + miniBlock(h) + '</div>' : "";

    const states = ["All"].concat(rows.map(r => r.state).filter((v, i, a) => a.indexOf(v) === i));
    $("chips").innerHTML = states.map(s => '<button class="' + (s === stateSel ? "on" : "") + '" data-s="' + esc(s) + '">' + (s === "All" ? t("all") : esc(s)) + '</button>').join("");

    const list = visible();
    $("count").textContent = list.length + " " + t("dist");
    $("list").innerHTML = list.map(r =>
      '<div class="card' + (h && r === h ? " is-home" : "") + '">' +
        '<div class="top"><div><div class="name">' + esc(label(r)) + '</div><div class="state">' + esc(r.state) + '</div></div>' +
        '<div class="price"><b>₹' + r.farm + '</b>' + arrow(r) + '</div></div>' + miniBlock(r) + '</div>').join("");
    $("empty").style.display = list.length ? "none" : "block";
  }

  $("chips").addEventListener("click", e => { const s = e.target && e.target.getAttribute && e.target.getAttribute("data-s"); if (s) { stateSel = s; render(); } });
  $("search").addEventListener("input", render);
  $("sort").addEventListener("change", render);
  $("lang").addEventListener("click", () => { useKn = !useKn; render(); });
  $("share").addEventListener("click", () => {
    const list = visible().slice(0, 15);
    const text = "*Koliva* — " + DATE + "\nFarm rate (₹/kg)\n\n" + list.map(r => label(r) + ": ₹" + r.farm).join("\n") +
      "\n\n" + window.location.href.split("#")[0];
    window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
  });

  $("fab").href = WA_URL;
  $("waLink").href = WA_URL;
  $("callLink").href = "tel:+" + PHONE;
  applyLabels();
  load();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koliva — Daily Poultry Rates</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+Kannada:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bd-dk:#3b1106;--barn:#6c200f;--bd-lt:#9a3412;--gold:#d97706;--gold-sf:#fef3c7;--gold-bd:#f59e0b;--bg:#f6f3ec;--card:#fff;--tile:#faf8f4;--tx:#1c1917;--mut:#6b635b;--bd:#e6e0d6;--up:#15803d;--up-bg:#dcfce7;--dn:#b91c1c;--dn-bg:#fee2e2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-size:16px;line-height:1.45;font-family:"Inter","Noto Sans Kannada",system-ui,sans-serif;background:var(--bg);color:var(--tx);font-variant-numeric:tabular-nums}
header{background:linear-gradient(135deg,var(--bd-dk) 0%,var(--barn) 55%,var(--bd-lt) 100%);color:#fff;padding:24px 18px 38px;position:relative;border-bottom:3px solid var(--gold)}
.head{max-width:760px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:14px}
.brand-mark{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.12);border:1px solid rgba(251,191,36,.45);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-mark svg{width:28px;height:28px;fill:#fbbf24}
.brand-text h1{margin:0;font-size:1.55rem;font-weight:800;color:#fff;line-height:1.1}
.brand-text p{margin:5px 0 0;color:#fde68a;font-size:.86rem;font-weight:500}
#lang{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:9px 16px;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
main{max-width:760px;margin:-18px auto 0;padding:0 16px 12px;position:relative;z-index:2}
.home{background:linear-gradient(180deg,#fffdf9 0%,#fff 100%);border-radius:20px;padding:22px;box-shadow:0 10px 28px rgba(59,17,6,.1);border:1.5px solid var(--gold-bd);margin-bottom:20px}
.home-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.home-badge{display:inline-flex;align-items:center;gap:6px;background:var(--gold-sf);color:#92400e;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:4px 10px;border-radius:999px}
.home-badge svg{width:13px;height:13px;fill:#d97706}
.home h2{margin:4px 0 0;font-size:1.15rem;font-weight:700}
.home-main{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;margin:8px 0 4px}
.home .big{font-size:2.5rem;font-weight:800;color:var(--bd-dk);line-height:1;display:flex;align-items:center;gap:12px}
.unit-label{color:var(--mut);font-size:.82rem;font-weight:500}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.mini div{background:var(--tile);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.mini small{display:block;color:var(--mut);font-size:.7rem;font-weight:600;text-transform:uppercase;margin-bottom:3px}
.mini b{font-size:1.05rem;font-weight:700}
.search-wrap{position:relative;margin-bottom:14px}
.search-wrap svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--mut);pointer-events:none}
#search{width:100%;height:50px;font:inherit;font-size:.95rem;padding:0 16px 0 44px;border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--mut);border-radius:999px;padding:9px 18px;font:inherit;font-size:.88rem;font-weight:600;cursor:pointer}
.chips button.on{background:var(--barn);color:#fff;border-color:var(--barn)}
.tools{display:flex;gap:10px;margin:4px 0 18px}
.tools select,.tools button{flex:1;height:46px;font:inherit;font-size:.9rem;font-weight:600;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);padding:0 14px;cursor:pointer}
#share{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--bd-dk);color:#fff;border-color:var(--bd-dk)}
#share svg{width:17px;height:17px;fill:currentColor}
.count{color:var(--mut);font-size:.82rem;font-weight:600;text-transform:uppercase;margin:0 4px 12px}
.list{display:grid;gap:14px}
.card{background:var(--card);border-radius:18px;padding:18px;border:1px solid var(--bd);box-shadow:0 2px 8px rgba(28,25,23,.04)}
.card.is-home{border:1.5px solid var(--gold-bd);background:linear-gradient(180deg,#fffdf9 0%,#fff 100%)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.name{font-weight:700;font-size:1.08rem}
.state{color:var(--mut);font-size:.78rem;margin-top:3px}
.price{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.price b{font-size:1.65rem;font-weight:800;color:var(--bd-dk);line-height:1}
.chg{display:inline-flex;align-items:center;font-size:.76rem;font-weight:700;padding:2px 8px;border-radius:999px}
.up{color:var(--up);background:var(--up-bg)}.dn{color:var(--dn);background:var(--dn-bg)}.same{color:var(--mut);background:var(--tile)}
#empty{text-align:center;color:var(--mut);background:var(--card);border:1px dashed var(--bd);border-radius:16px;padding:36px 16px;display:none}
#status{text-align:center;color:var(--mut);font-size:.82rem;padding:24px 16px 8px;display:flex;align-items:center;justify-content:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--up);display:inline-block}
#status.bad{color:var(--dn);font-weight:600}#status.bad .dot{background:var(--dn)}
footer{text-align:center;color:var(--mut);font-size:.78rem;max-width:540px;margin:0 auto;padding:4px 16px 18px}
.creator-wrap{max-width:760px;margin:8px auto 38px;padding:0 16px}
.creator-card{background:linear-gradient(135deg,#fffdf9 0%,#faf5eb 100%);border:1px solid var(--bd);border-left:4px solid var(--barn);border-radius:18px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
.creator-info{display:flex;align-items:center;gap:14px}
.creator-avatar{width:56px;height:56px;border-radius:50%;border:2px solid var(--gold);background:var(--bd-dk);color:#fde68a;font-weight:800;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.creator-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.creator-meta small{display:block;font-size:.68rem;font-weight:700;text-transform:uppercase;color:var(--bd-lt);margin-bottom:2px}
.creator-meta strong{display:block;font-size:1.05rem;font-weight:800}
.creator-meta span{display:block;font-size:.8rem;color:var(--mut)}
.wa-btn{display:inline-flex;align-items:center;gap:8px;background:#15803d;color:#fff;text-decoration:none;font-size:.88rem;font-weight:700;padding:10px 18px;border-radius:999px}
.wa-btn svg{width:18px;height:18px;fill:currentColor}
@media(min-width:700px){.list{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.creator-card{flex-direction:column;align-items:flex-start}.wa-btn{width:100%;justify-content:center}}
</style>
</head>
<body>
<header>
  <div class="head">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24"><path d="M18.5 3.5c-1.2 0-2.2.6-2.8 1.5-.5-.3-1.1-.5-1.7-.5-1.9 0-3.5 1.6-3.5 3.5 0 .4.1.8.2 1.2-2.3.8-4.2 2.7-4.7 5.3-.5 2.5.8 5 3.1 6h9.4c2.2 0 4-1.8 4-4 0-1.7-.8-3.2-2.1-4.1.7-.9 1.1-2 1.1-3.2 0-1.3-.7-2.5-1.8-3.2.5-.7.8-1.6.8-2.5 0-.6-.4-1-1-1zm-1.5 5c.6 0 1 .4 1 1s-.4 1-1 1-1-.4-1-1 .4-1 1-1z"/></svg></div>
      <div class="brand-text"><h1>Koliva</h1><p id="sub">Daily broiler &amp; poultry market rates</p></div>
    </div>
    <button id="lang" type="button">ಕನ್ನಡ / EN</button>
  </div>
</header>
<main>
  <div id="home"></div>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="search" type="search" placeholder="Search district / ಜಿಲ್ಲೆ ಹುಡುಕಿ">
  </div>
  <div class="chips" id="chips"></div>
  <div class="tools">
    <select id="sort"><option value="list">Sort: Default</option><option value="high">Highest rate</option><option value="low">Lowest rate</option><option value="az">A – Z</option></select>
    <button id="share" type="button"><svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg><span>Share Rates</span></button>
  </div>
  <p class="count" id="count"></p>
  <div class="list" id="list"></div>
  <div id="empty">No matching district found.</div>
  <div id="status">Loading market rates…</div>
</main>
<footer id="foot"></footer>
<section class="creator-wrap">
  <div class="creator-card">
    <div class="creator-info">
      <div class="creator-avatar"><img src="profile.jpg" alt="Gagan S Poojary" onerror="this.style.display='none';document.getElementById('av-fb').style.display='block'"><span id="av-fb" style="display:none">GSP</span></div>
      <div class="creator-meta"><small>Created &amp; Managed By</small><strong>Gagan S Poojary</strong><span>Koliva Poultry Market Network</span></div>
    </div>
    <a class="wa-btn" href="https://wa.me/919606468213?text=Hi%20Gagan%2C%20I%20checked%20today%27s%20poultry%20rates%20on%20Koliva." target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91C21.95 6.45 17.5 2 12.04 2zm5.82 14.01c-.24.68-1.41 1.3-1.95 1.38-.5.08-1.13.11-1.82-.11-.42-.13-.96-.31-1.65-.61-2.9-1.25-4.79-4.17-4.93-4.36-.14-.19-1.18-1.57-1.18-2.99 0-1.42.74-2.12 1.01-2.41.26-.29.58-.36.77-.36.19 0 .38.01.55.01.18 0 .41-.07.64.49.24.58.82 2 .89 2.14.07.14.12.31.02.5-.1.19-.14.31-.29.48-.14.17-.3.38-.43.51-.14.14-.29.3-.13.58.17.29.75 1.23 1.61 2 .89.79 1.62 1.04 1.91 1.18.29.14.46.12.63-.07.17-.19.72-.84.91-1.13.19-.29.38-.24.65-.14.26.1 1.68.79 1.97.94.29.14.48.22.55.34.07.12.07.7-.17 1.38z"/></svg>
      <span>WhatsApp: +91 96064 68213</span>
    </a>
  </div>
</section>
<script>
const SHEET_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vTphSTVLmbBqoofGulT2t_zXbxLzBcRbp0h2VRjDzOh8e49uF2Y9cDnT1B13XhEJevz_VAMoUQH_xt-/pub?gid=506287089&single=true&output=csv";
const HOME_DISTRICT="Udupi";
const NOTE="Rates are indicative. Please confirm with your local dealer before selling.";
let rows=[],DATE="",stateSel="All",useKn=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=s=>{const n=parseFloat(String(s==null?"":s).replace(/[^0-9.\-]/g,""));return isNaN(n)?0:n};
const T={farm:["Farm rate","ಫಾರ್ಮ್ ದರ"],whole:["Wholesale","ಸಗಟು"],retail:["Retail","ಚಿಲ್ಲರೆ"],chick:["Chick","ಮರಿ"],all:["All","ಎಲ್ಲಾ"],today:["Featured Market","ಪ್ರಮುಖ ಮಾರುಕಟ್ಟೆ"]};
const t=k=>T[k][useKn?1:0];
function parseCSV(tx){
  const out=[];let row=[],cur="",q=false;
  for(let i=0;i<tx.length;i++){
    const c=tx[i];
    if(q){if(c==='"'&&tx[i+1]==='"'){cur+='"';i++}else if(c==='"')q=false;else cur+=c}
    else if(c==='"')q=true;
    else if(c===","){row.push(cur);cur=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&tx[i+1]==="\n")i++;row.push(cur);out.push(row);row=[];cur=""}
    else cur+=c;
  }
  if(cur!==""||row.length){row.push(cur);out.push(row)}
  return out;
}
function readSheet(csv){
  const data=parseCSV(csv);
  let d=((data[0]&&data[0][1])||"").trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){const dt=new Date(d);d=(d&&!isNaN(dt))?dt.getFullYear()+"-"+("0"+(dt.getMonth()+1)).slice(-2)+"-"+("0"+dt.getDate()).slice(-2):""}
  DATE=d;rows=[];
  for(let i=2;i<data.length;i++){
    const r=data[i].map(s=>(s||"").trim());
    if(!r[1]||!r[4])continue;
    const farm=num(r[4]);
    rows.push({order:rows.length,state:r[0]||"Other States",name:r[1],kn:r[2]||r[1],prev:r[3]?num(r[3]):farm,farm:farm,whole:num(r[5]),retail:num(r[6]),chick:num(r[7])});
  }
}
async function load(){
  let csv=null,source="",err="";
  try{
    const res=await fetch(SHEET_URL+(SHEET_URL.indexOf("?")>-1?"&":"?")+"t="+Date.now(),{cache:"no-store"});
    if(!res.ok)throw new Error("HTTP "+res.status);
    csv=await res.text();source="live";
    try{localStorage.setItem("koli_csv",csv)}catch(e){}
  }catch(e){
    err=e&&e.message?e.message:String(e);
    try{csv=localStorage.getItem("koli_csv");if(csv)source="saved"}catch(e2){}
  }
  const st=$("status");
  if(!csv){st.className="bad";st.innerHTML='<span class="dot"></span> Could not load rates ('+esc(err)+').';return}
  readSheet(csv);
  st.className=source==="live"?"":"bad";
  st.innerHTML=source==="live"?'<span class="dot"></span> Live market feed synced':'<span class="dot"></span> Showing last saved rates ('+esc(err)+').';
  $("foot").textContent=NOTE;render();
}
const label=r=>useKn?r.kn:r.name;
const arrow=r=>{const d=r.farm-r.prev;return d>0?'<span class="chg up">▲ +'+d+'</span>':(d<0?'<span class="chg dn">▼ '+d+'</span>':'<span class="chg same">• 0</span>')};
const miniBlock=r=>'<div class="mini"><div><small>'+t("whole")+'</small><b>₹'+r.whole+'</b></div><div><small>'+t("retail")+'</small><b>₹'+r.retail+'</b></div><div><small>'+t("chick")+'</small><b>₹'+r.chick+'</b></div></div>';
function visible(){
  const q=$("search").value.trim().toLowerCase();
  const list=rows.filter(r=>(stateSel==="All"||r.state===stateSel)&&(!q||r.name.toLowerCase().indexOf(q)>-1||r.kn.indexOf(q)>-1));
  const s=$("sort").value;
  if(s==="high")list.sort((a,b)=>b.farm-a.farm);
  if(s==="low")list.sort((a,b)=>a.farm-b.farm);
  if(s==="az")list.sort((a,b)=>a.name.localeCompare(b.name));
  if(s==="list")list.sort((a,b)=>a.order-b.order);
  return list;
}
function render(){
  if(DATE){const dd=new Date(DATE+"T00:00:00");$("sub").textContent="Daily broiler rates • "+(isNaN(dd)?DATE:dd.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}))}
  const h=rows.find(r=>r.name.toLowerCase().indexOf(HOME_DISTRICT.toLowerCase())===0);
  $("home").innerHTML=h?'<div class="home"><div class="home-head"><span class="home-badge"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>'+t("today")+'</span><span class="unit-label">'+esc(h.state)+'</span></div><h2>'+esc(label(h))+'</h2><div class="home-main"><div class="big">₹'+h.farm+' '+arrow(h)+'</div><span class="unit-label">'+t("farm")+' / kg</span></div>'+miniBlock(h)+'</div>':"";
  const states=["All"].concat(rows.map(r=>r.state).filter((v,i,a)=>a.indexOf(v)===i));
  $("chips").innerHTML=states.map(s=>'<button class="'+(s===stateSel?"on":"")+'" data-s="'+esc(s)+'">'+(s==="All"?t("all"):esc(s))+'</button>').join("");
  const list=visible();
  $("count").textContent=list.length+" Market Districts";
  $("list").innerHTML=list.map(r=>'<div class="card'+(h&&r===h?" is-home":"")+'"><div class="top"><div><div class="name">'+esc(label(r))+'</div><div class="state">'+esc(r.state)+'</div></div><div class="price"><b>₹'+r.farm+'</b>'+arrow(r)+'</div></div>'+miniBlock(r)+'</div>').join("");
  $("empty").style.display=list.length?"none":"block";
}
$("chips").addEventListener("click",e=>{const s=e.target&&e.target.getAttribute&&e.target.getAttribute("data-s");if(s){stateSel=s;render()}});
$("search").addEventListener("input",render);
$("sort").addEventListener("change",render);
$("lang").addEventListener("click",()=>{useKn=!useKn;render()});
$("share").addEventListener("click",()=>{
  const list=visible().slice(0,15);
  const text="*KOLIVA POULTRY RATES* ("+DATE+")\n_Farm Gate Rate (₹/kg)_\n\n"+list.map(r=>"• "+label(r)+": *₹"+r.farm+"*").join("\n")+"\n\n_Updated by Gagan S Poojary (+91 96064 68213)_";
  window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank");
});
load();
</script>
</body>
</html>

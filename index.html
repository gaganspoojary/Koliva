<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koliva — Daily Poultry Rates</title>
<meta name="description" content="Koliva: members-only daily district-wise poultry rates in Kannada and English.">
<meta name="theme-color" content="#14532d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M24 4c-8 0-14 11-14 20a14 14 0 0 0 28 0C38 15 32 4 24 4z' fill='%23e9a23b'/%3E%3C/svg%3E">
<style>
  :root { --forest:#14532d; --leaf:#2f7d4f; --cream:#f6efdc; --paper:#fffdf8; --egg:#e9a23b; --ink:#1f2a1f; --mut:#6b6a58; --line:#ebe1c4; --up:#157a3c; --dn:#b3261e; --wa:#1faa59; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  body { margin:0; font-size:16px; line-height:1.4; font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Kannada",sans-serif; background:var(--cream); color:var(--ink); }
  a { color:inherit; }
  header { position:relative; background:linear-gradient(180deg,#0f4423 0%,#1b6a3b 100%); color:#fff; padding:20px 18px 104px; overflow:hidden; }
  .head { max-width:720px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; position:relative; z-index:2; }
  .brand { display:flex; align-items:center; gap:12px; }
  .logo { width:50px; height:50px; flex:none; filter:drop-shadow(0 2px 4px rgba(0,0,0,.3)); }
  .brand h1 { margin:0; font:700 1.8rem/1 Georgia,"Times New Roman",serif; letter-spacing:.3px; }
  .brand small { display:block; margin-top:5px; font-size:.7rem; letter-spacing:.16em; text-transform:uppercase; opacity:.85; }
  #lang { background:rgba(255,255,255,.14); color:#fff; border:1px solid rgba(255,255,255,.4); border-radius:999px; padding:9px 15px; font:inherit; font-size:.9rem; white-space:nowrap; }
  .updated { max-width:720px; margin:18px auto 0; position:relative; z-index:2; }
  .updated span { display:inline-block; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.28); border-radius:999px; padding:6px 14px; font-size:.85rem; }
  .hills { position:absolute; left:0; right:0; bottom:-1px; width:100%; height:92px; z-index:1; }
  main { max-width:720px; margin:-14px auto 0; padding:0 16px 8px; position:relative; z-index:3; }

  .gate { background:linear-gradient(180deg,#fffdf8,#fbf5e4); border:1px solid var(--line); border-radius:22px; padding:26px 22px; box-shadow:0 10px 30px rgba(20,83,45,.16); text-align:center; margin-bottom:24px; }
  .gate h2 { margin:0 0 8px; font:700 1.4rem/1.2 Georgia,"Times New Roman",serif; color:var(--forest); }
  .gate p { margin:0 0 18px; color:var(--mut); }
  .gbtn { display:inline-flex; align-items:center; justify-content:center; gap:10px; width:100%; max-width:320px; height:52px; border:1px solid #d9d2b8; background:#fff; border-radius:14px; font:inherit; font-weight:600; color:var(--ink); }
  .gdot { width:24px; height:24px; border-radius:50%; background:conic-gradient(#ea4335 0 25%,#fbbc05 0 50%,#34a853 0 75%,#4285f4 0); position:relative; }
  .gdot:after { content:""; position:absolute; inset:5px; background:#fff; border-radius:50%; }
  .err { color:var(--dn); font-size:.85rem; margin-top:12px; min-height:1.2em; word-break:break-word; }
  .gate .sub { margin-top:18px; font-size:.9rem; color:var(--mut); }
  .gate .sub a { color:var(--leaf); font-weight:700; }
  .gate .linkbtn { margin-top:10px; background:none; border:none; font:inherit; color:var(--leaf); font-weight:700; text-decoration:underline; }
  .reason { background:#fbe5e3; color:var(--dn); border-radius:12px; padding:12px 14px; margin-bottom:18px; font-weight:600; }
  .who { font-size:.85rem; color:var(--mut); margin-bottom:12px; word-break:break-all; }

  .home { position:relative; overflow:hidden; background:linear-gradient(180deg,#fffdf8,#fbf5e4); border:1px solid var(--line); border-radius:22px; padding:20px 20px 20px 24px; box-shadow:0 10px 30px rgba(20,83,45,.16); margin-bottom:24px; }
  .home:before { content:""; position:absolute; left:0; top:0; bottom:0; width:6px; background:linear-gradient(var(--egg),#d4851a); }
  .eyebrow { font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:var(--leaf); font-weight:700; }
  .home h2 { margin:4px 0 0; font:700 1.35rem/1.2 Georgia,"Times New Roman",serif; color:var(--forest); }
  .big { display:flex; align-items:center; flex-wrap:wrap; gap:10px; margin-top:10px; font-size:2.8rem; line-height:1; font-weight:800; color:var(--forest); font-variant-numeric:tabular-nums; }
  .unit { color:var(--mut); font-size:.85rem; margin-top:6px; }
  .mini { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px; }
  .mini div { background:#faf3df; border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .mini small { display:block; color:var(--mut); font-size:.72rem; }
  .mini b { font-size:1.05rem; font-variant-numeric:tabular-nums; }
  #search { width:100%; height:52px; font:inherit; padding:0 18px; border:1px solid var(--line); border-radius:14px; background:var(--paper); margin-bottom:14px; }
  #search:focus { outline:2px solid var(--leaf); }
  .chips { display:flex; gap:10px; overflow-x:auto; padding:2px 0 12px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chips button { flex:none; border:1px solid var(--line); background:var(--paper); color:var(--ink); border-radius:999px; padding:10px 18px; font:inherit; }
  .chips button.on { background:var(--forest); color:#fff; border-color:var(--forest); }
  .tools { display:flex; gap:10px; margin:4px 0 22px; }
  .tools select, .tools button { flex:1; height:48px; font:inherit; font-size:.95rem; border:1px solid var(--line); border-radius:12px; background:var(--paper); padding:0 12px; }
  .tools button { display:flex; align-items:center; justify-content:center; gap:8px; background:var(--wa); border-color:var(--wa); color:#fff; font-weight:600; }
  .sechead { display:flex; justify-content:space-between; align-items:baseline; margin:0 4px 12px; }
  .sechead h3 { margin:0; font:700 1.15rem/1.2 Georgia,"Times New Roman",serif; color:var(--forest); }
  .count { color:var(--mut); font-size:.85rem; }
  .list { display:grid; gap:14px; }
  .card { background:var(--paper); border:1px solid var(--line); border-radius:18px; padding:16px 18px; box-shadow:0 2px 8px rgba(80,60,20,.07); }
  .card.is-home { border-color:var(--egg); }
  .top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .name { font-weight:650; font-size:1.05rem; }
  .state { color:var(--mut); font-size:.8rem; margin-top:2px; }
  .price { text-align:right; }
  .price b { font-size:1.75rem; font-weight:800; display:block; line-height:1.1; color:var(--forest); font-variant-numeric:tabular-nums; }
  .card .mini { margin-top:12px; }
  .chg { display:inline-block; margin-top:6px; padding:2px 9px; border-radius:999px; font-size:.78rem; font-weight:700; }
  .big .chg { margin-top:0; font-size:.9rem; }
  .chg.up { background:#e3f4e8; color:var(--up); } .chg.dn { background:#fbe5e3; color:var(--dn); } .chg.same { background:#eee9d6; color:var(--mut); }
  .note { text-align:center; color:var(--mut); padding:26px 0; }

  footer { margin-top:18px; padding:26px 18px 110px; background:#ece3c6; text-align:center; color:var(--mut); font-size:.85rem; }
  .wrapf { max-width:720px; margin:0 auto; }
  .btns { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:16px; }
  .btn { display:inline-flex; align-items:center; gap:8px; padding:12px 20px; border-radius:999px; text-decoration:none; font-weight:600; font-size:.95rem; }
  .btn.wa { background:var(--wa); color:#fff; } .btn.call { background:var(--forest); color:#fff; }
  .creator { display:flex; align-items:center; gap:14px; justify-content:center; text-align:left; background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin:18px auto 14px; max-width:360px; }
  .avatar { position:relative; width:58px; height:58px; border-radius:50%; background:var(--forest); color:#fff; display:grid; place-items:center; font-weight:700; overflow:hidden; border:2px solid var(--egg); flex:none; }
  .avatar img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .creator small { display:block; color:var(--mut); font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; }
  .creator b { display:block; color:var(--ink); font-size:1.05rem; }
  .creator a { color:var(--leaf); font-size:.85rem; font-weight:600; }
  #acct { margin-top:8px; }
  #acct a, #acct button { color:var(--leaf); font-weight:700; background:none; border:none; font:inherit; font-weight:700; text-decoration:underline; padding:0 4px; }
  .fab { position:fixed; right:16px; bottom:16px; z-index:20; display:flex; align-items:center; gap:8px; background:var(--wa); color:#fff; text-decoration:none; font-weight:600; padding:13px 18px; border-radius:999px; box-shadow:0 6px 18px rgba(0,0,0,.28); }
  @media (min-width:700px) { .list { grid-template-columns:1fr 1fr; } }
</style>
</head>
<body>

<header>
  <div class="head">
    <div class="brand">
      <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
        <rect width="48" height="48" rx="12" fill="#f6efdc"/>
        <path d="M24 8c-7 0-12 10-12 18a12 12 0 0 0 24 0c0-8-5-18-12-18z" fill="#e9a23b"/>
        <path d="M24 14c-3 0-6 5-6 10" stroke="#fff" stroke-opacity=".55" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M30 37c4-1 7-4 8-8-4 0-7 3-8 8z" fill="#2f7d4f"/>
      </svg>
      <div><h1>Koliva</h1><small>Poultry Rates · ಕೋಳಿ ದರ</small></div>
    </div>
    <button id="lang" type="button">ಕನ್ನಡ / EN</button>
  </div>
  <div class="updated"><span id="sub"></span></div>
  <svg class="hills" viewBox="0 0 720 92" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <circle cx="130" cy="28" r="11" fill="#f3c35a" opacity=".9"/>
    <path d="M0 62C120 32 240 72 360 52S600 32 720 57V92H0Z" fill="#2f7d4f" opacity=".6"/>
    <path d="M0 74C150 50 300 84 450 68S650 58 720 72V92H0Z" fill="#3a8a56"/>
    <rect x="412" y="50" width="44" height="26" fill="#8f2f2a"/>
    <polygon points="406,52 434,34 462,52" fill="#6a211e"/>
    <rect x="426" y="60" width="16" height="16" fill="#f6efdc" opacity=".92"/>
    <path d="M426 60l16 16M442 60l-16 16" stroke="#8f2f2a" stroke-width="1.5"/>
    <rect x="466" y="42" width="12" height="34" fill="#d9d2bd"/>
    <path d="M466 42a6 6 0 0 1 12 0z" fill="#b9b196"/>
    <path d="M0 84C140 68 300 92 460 80S650 74 720 82V92H0Z" fill="#f6efdc"/>
  </svg>
</header>

<main>
  <section id="v-loading"><div class="gate"><p id="t-loading" style="margin:0">Loading…</p></div></section>

  <section id="v-login" hidden>
    <div class="gate">
      <h2 id="t-lh"></h2>
      <p id="t-lp"></p>
      <button class="gbtn" id="btnGoogle" type="button"><span class="gdot"></span><span id="t-g"></span></button>
      <div class="err" id="loginErr"></div>
      <div class="sub"><span id="t-nm"></span> <a id="subLink" target="_blank" rel="noopener"></a></div>
    </div>
  </section>

  <section id="v-locked" hidden>
    <div class="gate">
      <h2 id="t-kh"></h2>
      <div class="reason" id="reason"></div>
      <div class="who" id="who"></div>
      <a class="gbtn" id="subBtn" target="_blank" rel="noopener" style="text-decoration:none"></a>
      <div><button class="linkbtn" id="btnOut" type="button"></button></div>
    </div>
  </section>

  <section id="v-app" hidden>
    <div id="home"></div>
    <input id="search" type="search" placeholder="Search district / ಜಿಲ್ಲೆ ಹುಡುಕಿ">
    <div class="chips" id="chips"></div>
    <div class="tools">
      <select id="sort">
        <option value="list">Sort: Default</option>
        <option value="high">Highest rate</option>
        <option value="low">Lowest rate</option>
        <option value="az">A – Z</option>
      </select>
      <button id="share" type="button"></button>
    </div>
    <div class="sechead"><h3 id="rhead"></h3><span class="count" id="count"></span></div>
    <div class="list" id="list"></div>
    <div class="note" id="empty" hidden></div>
  </section>
</main>

<footer>
  <div class="wrapf">
    <div class="btns">
      <a class="btn wa" id="waLink" target="_blank" rel="noopener"></a>
      <a class="btn call" id="callLink"></a>
    </div>
    <div id="foot"></div>
    <div class="creator" id="creator"></div>
    <div id="acct"></div>
    <p id="copy" style="margin:8px 0 0"></p>
  </div>
</footer>
<a class="fab" id="fab" target="_blank" rel="noopener"></a>

<script src="config.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  const K = window.KOLIVA;
  const app = initializeApp(K.firebase), auth = getAuth(app), db = getFirestore(app);
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
  const num = s => { const n = parseFloat(String(s == null ? "" : s).replace(/[^0-9.\-]/g, "")); return isNaN(n) ? 0 : n; };

  let rows = [], DATE = "", stateSel = "All", useKn = false, USER = null, VIEW = "loading", LOCK = "";

  const WA_ICON = '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 2a8 8 0 1 1-4.2 14.8l-.3-.2-2.4.6.6-2.3-.2-.3A8 8 0 0 1 12 4z"/><path d="M9 8c-.3.6-.5 1.3.2 2.5s2 2.6 3.7 3.2c1 .4 1.6.3 2.1-.2l.5-.9-1.8-.9-.7.7c-.8-.4-1.9-1.4-2.3-2.3l.6-.7L9.9 7.8z"/></svg>';
  const waUrl = msg => "https://wa.me/" + K.PHONE + "?text=" + encodeURIComponent(msg);

  const T = {
    farm: ["Farm rate", "ಫಾರ್ಮ್ ದರ"], whole: ["Wholesale", "ಸಗಟು"], retail: ["Retail", "ಚಿಲ್ಲರೆ"], chick: ["Chick", "ಮರಿ"],
    all: ["All", "ಎಲ್ಲಾ"], today: ["Today's rate", "ಇಂದಿನ ದರ"], share: ["Share Koliva", "Koliva ಹಂಚಿ"], chat: ["WhatsApp", "ವಾಟ್ಸಾಪ್"],
    call: ["Call", "ಕರೆ ಮಾಡಿ"], rates: ["District rates", "ಜಿಲ್ಲಾವಾರು ದರ"], dist: ["districts", "ಜಿಲ್ಲೆಗಳು"],
    built: ["Website created by", "ವೆಬ್‌ಸೈಟ್ ರಚನೆ"], daily: ["Daily poultry rates", "ಪ್ರತಿದಿನದ ಕೋಳಿ ದರ"],
    members: ["Members-only daily poultry rates", "ಸದಸ್ಯರಿಗೆ ಮಾತ್ರ ದೈನಂದಿನ ಕೋಳಿ ದರ"],
    lh: ["Members only", "ಸದಸ್ಯರಿಗೆ ಮಾತ್ರ"], lp: ["Sign in with your Google account to see today's rates.", "ಇಂದಿನ ದರ ನೋಡಲು Google ಖಾತೆಯಿಂದ ಸೈನ್ ಇನ್ ಮಾಡಿ."],
    g: ["Continue with Google", "Google ಮೂಲಕ ಮುಂದುವರಿಸಿ"], nm: ["Not a member yet?", "ಇನ್ನೂ ಸದಸ್ಯರಲ್ಲವೇ?"], nmL: ["WhatsApp us to subscribe", "ಚಂದಾದಾರರಾಗಲು ವಾಟ್ಸಾಪ್ ಮಾಡಿ"],
    kh: ["Access needed", "ಪ್ರವೇಶ ಬೇಕು"], sub: ["Message us on WhatsApp", "ವಾಟ್ಸಾಪ್‌ನಲ್ಲಿ ಸಂದೇಶ ಕಳುಹಿಸಿ"],
    out: ["Sign out / use another account", "ಸೈನ್ ಔಟ್ / ಬೇರೆ ಖಾತೆ"], signout: ["Sign out", "ಸೈನ್ ಔಟ್"],
    signed: ["Signed in as", "ಸೈನ್ ಇನ್:"], admin: ["Admin", "ಅಡ್ಮಿನ್"], loading: ["Loading…", "ಲೋಡ್ ಆಗುತ್ತಿದೆ…"],
    none: ["No district found.", "ಯಾವುದೇ ಜಿಲ್ಲೆ ಸಿಗಲಿಲ್ಲ."], norates: ["Today's rates are not published yet. Please check back soon.", "ಇಂದಿನ ದರ ಇನ್ನೂ ಪ್ರಕಟವಾಗಿಲ್ಲ. ಸ್ವಲ್ಪ ಸಮಯದ ನಂತರ ನೋಡಿ."]
  };
  const t = k => T[k][useKn ? 1 : 0];
  const fmt = d => d.toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
  const initials = n => n.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join("");
  const isAdmin = () => USER && (USER.email || "").toLowerCase() === K.ADMIN_EMAIL.toLowerCase();

  function show(v) {
    VIEW = v;
    ["loading", "login", "locked", "app"].forEach(n => { $("v-" + n).hidden = n !== v; });
    labels();
  }

  function labels() {
    $("t-loading").textContent = t("loading");
    $("t-lh").textContent = t("lh"); $("t-lp").textContent = t("lp"); $("t-g").textContent = t("g");
    $("t-nm").textContent = t("nm");
    $("subLink").textContent = t("nmL"); $("subLink").href = waUrl("Hello Koliva, I want to subscribe to the daily poultry rates.");
    $("t-kh").textContent = t("kh");
    $("subBtn").innerHTML = WA_ICON + "<span>" + t("sub") + "</span>";
    $("subBtn").href = waUrl("Hello Koliva, I want to subscribe. My Google email is " + (USER ? USER.email : "") + ".");
    $("btnOut").textContent = t("out");
    $("reason").textContent = LOCK; $("who").textContent = USER ? t("signed") + " " + USER.email : "";
    $("share").innerHTML = WA_ICON + "<span>" + t("share") + "</span>";
    $("fab").innerHTML = WA_ICON + "<span>" + t("chat") + "</span>"; $("fab").href = waUrl("Hello Koliva, I would like to know more about your poultry rates.");
    $("waLink").innerHTML = WA_ICON + "<span>" + t("chat") + "</span>"; $("waLink").href = $("fab").href;
    $("callLink").textContent = t("call") + " " + K.PHONE_DISPLAY; $("callLink").href = "tel:+" + K.PHONE;
    $("rhead").textContent = t("rates"); $("foot").textContent = K.NOTE;
    $("copy").textContent = "© " + new Date().getFullYear() + " Koliva";
    $("sub").textContent = VIEW === "app" && DATE ? t("daily") + " — " + fmt(new Date(DATE + "T00:00:00")) : t("members");
    $("creator").innerHTML =
      '<div class="avatar"><span>' + esc(initials(K.CREATOR_NAME)) + '</span>' + (K.CREATOR_PHOTO ? '<img src="' + esc(K.CREATOR_PHOTO) + '" alt="" onerror="this.remove()">' : "") + '</div>' +
      '<div><small>' + t("built") + '</small><b>' + esc(K.CREATOR_NAME) + '</b><a href="' + waUrl("Hello " + K.CREATOR_NAME + ", I saw your work on Koliva.") + '" target="_blank" rel="noopener">WhatsApp ' + K.PHONE_DISPLAY + '</a></div>';
    $("acct").innerHTML = USER ? esc(t("signed")) + " " + esc(USER.email) + ' · <button id="so" type="button">' + t("signout") + '</button>' +
      (isAdmin() ? ' · <a href="admin.html">' + t("admin") + '</a>' : "") : "";
    const so = $("so"); if (so) so.onclick = () => signOut(auth);
  }

  function readTable(text) {
    rows = [];
    String(text || "").split("\n").forEach(line => {
      const p = line.split("|").map(s => s.trim());
      if (p.length < 5 || !p[1]) return;
      const farm = num(p[4]);
      rows.push({ order: rows.length, state: p[0] || "Other States", name: p[1], kn: p[2] || p[1], prev: p[3] ? num(p[3]) : farm, farm: farm, whole: num(p[5]), retail: num(p[6]), chick: num(p[7]) });
    });
  }

  async function lockReason(email) {
    let r = useKn ? "ಈ Google ಖಾತೆ ಇನ್ನೂ ಸದಸ್ಯರಾಗಿ ನೋಂದಾಯಿಸಲಾಗಿಲ್ಲ." : "This Google account is not registered as a member yet.";
    try {
      const m = await getDoc(doc(db, "members", email));
      if (m.exists()) {
        const d = m.data(), exp = d.expiresAt && d.expiresAt.toDate ? d.expiresAt.toDate() : null;
        if (d.active === false) r = "Your access is currently switched off.";
        else if (exp && exp < new Date()) r = "Your plan ended on " + fmt(exp) + ".";
      }
    } catch (e) {}
    return r;
  }

  onAuthStateChanged(auth, async user => {
    USER = user;
    if (!user) { show("login"); return; }
    show("loading");
    try {
      const snap = await getDoc(doc(db, "rates", "current"));
      if (!snap.exists()) { rows = []; DATE = ""; show("app"); render(); return; }
      const d = snap.data(); DATE = d.date || ""; readTable(d.table);
      show("app"); render();
    } catch (e) {
      if (e && e.code === "permission-denied") { LOCK = await lockReason((user.email || "").toLowerCase()); show("locked"); }
      else { LOCK = "Could not load rates (" + (e.code || e.message) + "). Please refresh."; show("locked"); }
    }
  });

  $("btnGoogle").onclick = async () => {
    $("loginErr").textContent = "";
     try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch (e) { $("gerr").textContent = "Sign-in problem: " + (e.code || e.message); }
  };

  onAuthStateChanged(auth, user => {
    const ok = user && (user.email || "").toLowerCase() === K.ADMIN_EMAIL.toLowerCase();
    $("panel").hidden = !ok; $("gate").hidden = !!ok;
    if (user && !ok) {
      $("gate").hidden = false;
      $("gerr").innerHTML = esc(user.email) + " is not the admin account. ";
      const b = document.createElement("button"); b.className = "sec"; b.textContent = "Sign out"; b.onclick = () => signOut(auth); $("gerr").appendChild(b);
    }
    if (ok) { showCurrent(); loadMembers(); }
  });
</script>
</body>
</html>
